name: Validate release branch

on:
  push:
    branches: ["codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-plateau.txt
      - run: python -m pip install -r scripts/requirements-plateau.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
